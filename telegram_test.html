<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İmam Nevevî Kampı Testleri</title>
    
    <!-- Telegram Web App ve CSV Okuyucu (PapaParse) Kütüphaneleri -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <!-- FontAwesome ve Fontlar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Lora:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --zumrut: #0b2614;
            --zumrut-acik: #15381a;
            --altin: #E2B973;
            --yazi: #FAF5EF;
            --yesil: #2ecc71;
            --kirmizi: #e74c3c;
        }
        body { font-family: 'Lora', serif; background-color: var(--zumrut); color: var(--yazi); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .baslik-alani { text-align: center; margin-bottom: 25px; border-bottom: 2px dashed rgba(226, 185, 115, 0.4); padding-bottom: 15px; width: 100%; max-width: 400px; }
        .baslik-alani h1 { font-family: 'Cinzel', serif; color: var(--altin); font-size: 1.5rem; margin: 0 0 5px 0; }
        .baslik-alani p { margin: 0; font-size: 0.9rem; color: #dcebd2; opacity: 0.8; }
        
        #ekran-yukleniyor, #ekran-menu, #ekran-test, #ekran-sonuc { display: none; width: 100%; max-width: 400px; animation: fadeIn 0.4s ease; }
        .aktif-ekran { display: block !important; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Yükleniyor Ekranı */
        #ekran-yukleniyor { text-align: center; color: var(--altin); font-family: 'Cinzel', serif; margin-top: 50px; font-size: 1.2rem; }

        /* Butonlar */
        .bolum-btn { background: rgba(226, 185, 115, 0.1); border: 2px solid var(--altin); color: var(--altin); width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 12px; font-family: 'Cinzel', serif; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; }
        .bolum-btn:active { background: var(--altin); color: var(--zumrut); transform: scale(0.98); }

        /* Test Ekranı */
        .soru-baslik { font-size: 1.1rem; line-height: 1.6; margin-bottom: 20px; border-left: 4px solid var(--altin); padding-left: 10px; }
        .secenek-btn { background: var(--zumrut-acik); border: 1px solid rgba(226, 185, 115, 0.3); color: var(--yazi); width: 100%; padding: 12px 15px; margin-bottom: 10px; border-radius: 8px; font-size: 1rem; text-align: left; cursor: pointer; transition: 0.2s; font-family: 'Lora', serif; }
        .secenek-btn:active { background: rgba(226, 185, 115, 0.2); }
        .secenek-btn.dogru { background: rgba(46, 204, 113, 0.2); border-color: var(--yesil); color: var(--yesil); font-weight: bold; }
        .secenek-btn.yanlis { background: rgba(231, 76, 60, 0.2); border-color: var(--kirmizi); color: var(--kirmizi); }
        .secenek-btn:disabled { cursor: not-allowed; }

        .test-alt { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; font-size: 0.9rem; color: #dcebd2; }
        .ileri-btn { background: var(--altin); color: var(--zumrut); border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; display: none; }
        
        /* Sonuç Ekranı */
        .sonuc-kutu { background: var(--zumrut-acik); border: 2px solid var(--altin); border-radius: 15px; padding: 30px 20px; text-align: center; }
        .puan-yuvarlak { width: 100px; height: 100px; border-radius: 50%; border: 4px solid var(--altin); display: flex; justify-content: center; align-items: center; font-size: 2rem; font-weight: bold; color: var(--altin); margin: 0 auto 20px auto; font-family: 'Cinzel', serif; }
        .sonuc-mesaj { font-size: 1.1rem; margin-bottom: 25px; line-height: 1.5; }
        .ana-menu-btn { background: var(--altin); color: var(--zumrut); border: none; width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; font-family: 'Cinzel', serif; font-size: 1.1rem; cursor: pointer; }
    </style>
</head>
<body>

    <div class="baslik-alani">
        <h1>İmam Nevevî Kampı</h1>
        <p>Telegram Test Merkezi</p>
    </div>

    <!-- ⏳ YÜKLENİYOR EKRANI -->
    <div id="ekran-yukleniyor" class="aktif-ekran">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 15px;"></i>
        <br>Sorular E-Tablodan Çekiliyor...
    </div>

    <!-- 🧭 MENÜ EKRANI (Dinamik Dolacak) -->
    <div id="ekran-menu">
        <div id="dinamik-menuler"></div>
    </div>

    <!-- 📝 TEST EKRANI -->
    <div id="ekran-test">
        <div class="soru-baslik" id="soru-metni">Soru metni buraya gelecek...</div>
        <div id="secenekler-alani"></div>
        <div class="test-alt">
            <span id="soru-sayaci">Soru: 1/10</span>
            <button id="btn-ileri" class="ileri-btn" onclick="sonrakiSoru()">İleri <i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </div>

    <!-- ⭐ SONUÇ EKRANI -->
    <div id="ekran-sonuc">
        <div class="sonuc-kutu">
            <div class="puan-yuvarlak" id="sonuc-puan">0/0</div>
            <div class="sonuc-mesaj" id="sonuc-yazi">Tebrikler!</div>
            <button class="ana-menu-btn" onclick="anaMenuyeDon()">Ana Menüye Dön</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0b2614');

        // KRAL: GOOGLE E-TABLO CSV LİNKİNİ BURAYA YAPIŞTIR
        const CSV_URL = "BURAYA_CSV_LINKINI_YAPISTIR";

        let tumSorular = {};
        let aktifBolum = [];
        let guncelSoruIndex = 0;
        let dogruSayisi = 0;

        // Harfi index numarasına çevirici (A->0, B->1 vb.)
        const harfIndexi = { "A": 0, "B": 1, "C": 2, "D": 3, "E": 4 };
        const secenekHarfleri = ["A) ", "B) ", "C) ", "D) ", "E) "];

        // Sayfa açılınca soruları çek
        window.onload = () => {
            if(CSV_URL === "https://docs.google.com/spreadsheets/d/e/2PACX-1vQbE2BqilPJlGYwDX4-pODrgzyf-mv-rVLyLtN3TLEtNL4Y00PBfL_Dxo4pvM-hHkguQKIbtd6fE3vK/pub?output=csv"){
                alert("Kral, koddaki CSV_URL kısmına kendi linkini yapıştırmayı unutmuşsun!");
                return;
            }

            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    verileriIsle(results.data);
                },
                error: function(err) {
                    alert("Sorular çekilemedi. Bağlantıyı kontrol et kral.");
                }
            });
        };

        // Gelen CSV verisini bizim sisteme uyarlama
        function verileriIsle(data) {
            data.forEach(satir => {
                let bolum = satir.Bolum ? satir.Bolum.trim() : "Diger";
                if(!tumSorular[bolum]) tumSorular[bolum] = [];

                // Boş şıkları eleyerek seçenekler dizisi oluştur
                let secenekler = [];
                if(satir.A) secenekler.push(satir.A);
                if(satir.B) secenekler.push(satir.B);
                if(satir.C) secenekler.push(satir.C);
                if(satir.D) secenekler.push(satir.D);
                if(satir.E) secenekler.push(satir.E);

                // Doğru cevabın indexini bul
                let dogruHarf = satir.Dogru ? satir.Dogru.trim().toUpperCase() : "A";
                let dIndex = harfIndexi[dogruHarf] || 0;

                tumSorular[bolum].push({
                    soru: satir.Soru,
                    secenekler: secenekler,
                    dogruCevap: dIndex
                });
            });

            menuleriOlustur();
        }

        // Bölümlere göre butonları otomatik oluştur
        function menuleriOlustur() {
            let menuHTML = "";
            let bolumİsimleri = Object.keys(tumSorular);
            
            bolumİsimleri.forEach(bolumKey => {
                // "bolum1" yazısını "Bölüm 1" şeklinde düzeltmek için ufak bir makyaj
                let gosterimAdi = bolumKey.replace(/bolum/i, 'Bölüm ').toUpperCase();
                
                menuHTML += `
                <button class="bolum-btn" onclick="testiBaslat('${bolumKey}')">
                    <span>${gosterimAdi} Testi</span> <i class="fa-solid fa-chevron-right"></i>
                </button>`;
            });

            document.getElementById('dinamik-menuler').innerHTML = menuHTML;
            ekranGoster('ekran-menu');
        }

        function ekranGoster(ekranId) {
            document.getElementById('ekran-yukleniyor').classList.remove('aktif-ekran');
            document.getElementById('ekran-menu').classList.remove('aktif-ekran');
            document.getElementById('ekran-test').classList.remove('aktif-ekran');
            document.getElementById('ekran-sonuc').classList.remove('aktif-ekran');
            document.getElementById(ekranId).classList.add('aktif-ekran');
        }

        function testiBaslat(bolumAnahtari) {
            aktifBolum = tumSorular[bolumAnahtari];
            guncelSoruIndex = 0;
            dogruSayisi = 0;
            soruEkranaBas();
            ekranGoster('ekran-test');
        }

        function soruEkranaBas() {
            let soruData = aktifBolum[guncelSoruIndex];
            document.getElementById('soru-metni').innerHTML = "<b>" + (guncelSoruIndex + 1) + ".</b> " + soruData.soru;
            document.getElementById('soru-sayaci').innerText = "Soru: " + (guncelSoruIndex + 1) + "/" + aktifBolum.length;
            document.getElementById('btn-ileri').style.display = 'none';
            
            let seceneklerHTML = "";
            for(let i=0; i<soruData.secenekler.length; i++){
                seceneklerHTML += `<button class="secenek-btn" onclick="cevapKontrol(${i}, this)"><b>${secenekHarfleri[i]}</b> ${soruData.secenekler[i]}</button>`;
            }
            document.getElementById('secenekler-alani').innerHTML = seceneklerHTML;
        }

        function cevapKontrol(secilenIndex, btnElement) {
            let dogruIndex = aktifBolum[guncelSoruIndex].dogruCevap;
            let butonlar = document.querySelectorAll('.secenek-btn');
            
            butonlar.forEach(btn => btn.disabled = true);

            if(secilenIndex === dogruIndex) {
                btnElement.classList.add('dogru');
                btnElement.innerHTML += ' <i class="fa-solid fa-check" style="float:right; margin-top:3px;"></i>';
                dogruSayisi++;
                tg.HapticFeedback.notificationOccurred('success');
            } else {
                btnElement.classList.add('yanlis');
                btnElement.innerHTML += ' <i class="fa-solid fa-xmark" style="float:right; margin-top:3px;"></i>';
                butonlar[dogruIndex].classList.add('dogru');
                tg.HapticFeedback.notificationOccurred('error');
            }
            
            document.getElementById('btn-ileri').style.display = 'block';
        }

        function sonrakiSoru() {
            guncelSoruIndex++;
            if(guncelSoruIndex < aktifBolum.length) {
                soruEkranaBas();
            } else {
                testiBitir();
            }
        }

        function testiBitir() {
            document.getElementById('sonuc-puan').innerText = dogruSayisi + "/" + aktifBolum.length;
            let basariYuzdesi = dogruSayisi / aktifBolum.length;
            let mesaj = basariYuzdesi === 1 ? "Muazzam! Konuya tam olarak hakimsiniz." : 
                        basariYuzdesi >= 0.5 ? "Tebrikler, güzel bir sonuç. Notları bir kez daha gözden geçirebilirsiniz." : 
                        "Ders notlarını tekrar okumanız faydalı olacaktır. Gayret bizden, tevfik Allah'tandır.";
            
            document.getElementById('sonuc-yazi').innerText = mesaj;
            ekranGoster('ekran-sonuc');
            tg.HapticFeedback.notificationOccurred('warning');
        }

        function anaMenuyeDon() {
            ekranGoster('ekran-menu');
        }
    </script>
</body>
</html>
